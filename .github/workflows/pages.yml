# GH Pages build + deploy for the playable browser demo (M12).
#
# Build = exactly the local sequence: tuned wasm build (crates/wasm/build.sh
# -> pkg-web) -> vite build with the project-pages base -> battle data
# copied into dist/data/ (the app fetches it at runtime, never bundles it).
#
# Toolchain pins mirror the machine the parity gates were measured on:
# Rust 1.94.0 + wasm-pack 0.13.1 (wasm-opt settings ride in from
# crates/wasm/Cargo.toml package metadata), Node 22.

name: pages

on:
  workflow_dispatch:
  push:
    branches: [master, perf/portable-search-release]
    paths:
      - "web/**"
      - "crates/**"
      - "data/**"
      - "tools/preview-cache.js"
      - "tools/render-preview-cache-doc.py"
      - "tools/render-native-handoff.py"
      - "tools/normalize-training*"
      - "tools/build-training-products.js"
      - "tools/preview-prior*"
      - "tools/belief-pool-v3.py"
      - "tools/build-known-prior.mjs"
      - "tools/build-team-products-v2.js"
      - "tools/optimize-low-attack*"
      - "docs/PREVIEW-CACHE.md"
      - "docs/NATIVE-FORK-HANDOFF.md"
      - "README.md"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.0"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install wasm-pack 0.13.1
        run: |
          curl -sSfL https://github.com/rustwasm/wasm-pack/releases/download/v0.13.1/wasm-pack-v0.13.1-x86_64-unknown-linux-musl.tar.gz | tar -xz
          sudo install wasm-pack-v0.13.1-x86_64-unknown-linux-musl/wasm-pack /usr/local/bin/

      - name: Verify portable hashing and replay compatibility
        run: |
          cargo test -p nc2000-engine --lib
          cargo test -p conformance --test kifu --test replay

      - name: Build wasm (tuned profile)
        run: crates/wasm/build.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build validator and player-frame bindings
        run: crates/wasm/build.sh nodejs

      - name: Verify normalized training and exact prior coverage
        run: |
          node tools/build-training-products.js
          git diff --exit-code -- data/belief-pool-v3/known-expansion.json data/belief-pool-v3/belief-pool.json data/team-pool-v2/team-pool.json data/team-selection-v2/reference.json data/meta-nash-v3/pool-artifact.json data/kodoku-r3/conclusion-equilibrium-deme.json data/kodoku-r3/conclusion-equilibrium-r1.json data/training-v3/supplemental.json data/training-v3/rentals.json data/compiled-preview-v1.json data/team-pool-v2/preview-nash-matrix.json
          cargo run --quiet -p nc2000-bot --example verify_training -- target/training-verification.json
          cmp data/training-v3/verification.json target/training-verification.json
          node --test tools/normalize-training.test.js tools/optimize-low-attack.test.js web/tests/preview-prior.test.mjs
          cargo test -p nc2000-bot --example meta_eco catalog_preview::tests

      - name: Build web (project-pages base)
        working-directory: web
        env:
          NC2000_BASE: /nc2000-engine/
        run: |
          npm ci
          npm run build

      - name: Bundle battle data
        run: |
          mkdir -p web/dist/data
          # meta-pool-v0 is the belief `?fork` continues its hosted records
          # with; no door reads baked pair tables any more.
          cp -r data/meta-pool-v0 web/dist/data/
          cp data/gen2stadium2.json data/i18n-ja.json web/dist/data/
          # The belief-prior SAMPLE (never the live table: shipping one at
          # data/belief-prior-v0.json would turn the opt-in prior on by
          # default — see crates/bot/src/prior.rs). The setup panel's
          # "load the sample table" button fetches it at runtime.
          cp data/belief-prior-v0.sample.json web/dist/data/
          # Team rebuild (docs/TEAM-POOL-REBUILD-PLAN.md): the three shipped
          # files ONLY — the catalog (human lists + bot draw), the opponent
          # prior, and the Nash mixture. Measurements and the reference
          # inventory stay in the repo as audit trail, not payload.
          mkdir -p web/dist/data/team-pool-v2 web/dist/data/belief-pool-v3 web/dist/data/meta-nash-v3 web/dist/data/kodoku-r3
          cp data/team-pool-v2/team-pool.json web/dist/data/team-pool-v2/
          cp data/belief-pool-v3/belief-pool.json web/dist/data/belief-pool-v3/
          cp data/meta-nash-v3/pool-artifact.json web/dist/data/meta-nash-v3/
          cp data/kodoku-r3/conclusion-equilibrium-r1.json web/dist/data/kodoku-r3/
          cp data/kodoku-r3/conclusion-equilibrium-deme.json web/dist/data/kodoku-r3/
          # `?fork=NAME` documents; each one carries a player's full team.
          cp -r data/forks web/dist/data/
          test -s web/dist/data/gen2stadium2.json
          test -s web/dist/data/team-pool-v2/team-pool.json
          test -s web/dist/data/belief-pool-v3/belief-pool.json
          test -s web/dist/data/meta-nash-v3/pool-artifact.json
          test -s web/dist/data/kodoku-r3/conclusion-equilibrium-r1.json
          test -s web/dist/data/kodoku-r3/conclusion-equilibrium-deme.json

      - name: Verify complete production preview lookup
        working-directory: web
        env:
          NC2000_BASE: /nc2000-engine/
          NC2000_PREVIEW_CHECK_OUT: ../target/production-preview-verification.json
        run: |
          npx playwright install --with-deps chromium
          npm run test:preview-production
          NC2000_BASE=/ NC2000_CHECK_OUT=../target node tests/compiled-preview-coverage.mjs

      - name: Verify server cache bindings
        run: |
          for suite in smoke determinism parity kifu fork solver endgame destiny-bond priority-heal residual-wait own-recovery-wait preview-cache; do
            node "crates/wasm/tests-node/$suite.js"
          done
          python3 tools/render-preview-cache-doc.py web/dist
          python3 tools/render-native-handoff.py web/dist

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    # Candidate pushes build reviewable artifacts; only master is published.
    if: github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
